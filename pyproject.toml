[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "all-seeing-eye"
version = "0.1.0"
description = "Halloween projection project: an eye that follows people/cars"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.3",
]

[tool.setuptools.packages.find]
where = ["src"]
